# Save this file in your GitHub repo as:  .github/workflows/android.yml
name: Build APK
on:
  workflow_dispatch:
  push:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm install
      - run: mkdir -p www && cp index.html www/index.html
      - run: npx cap add android
      - name: Patch manifest and SDK versions
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#</application>#<meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="ca-app-pub-2257987164680269~4530684558"/></application>#' $M
          sed -i 's#</activity>#<intent-filter><action android:name="android.intent.action.VIEW"/><category android:name="android.intent.category.DEFAULT"/><category android:name="android.intent.category.BROWSABLE"/><data android:scheme="prismbeam"/></intent-filter></activity>#' $M
          sed -i 's/minSdkVersion = .*/minSdkVersion = 24/; s/targetSdkVersion = .*/targetSdkVersion = 36/; s/compileSdkVersion = .*/compileSdkVersion = 36/' android/variables.gradle
      - run: npx cap sync android
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: prism-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          
