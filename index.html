let tp=false,hist=[];
function transpose(){

 rots.forEach(r=>{const v=r.x;r.x=r.y;r.y=v});tgts.forEach(r=>{const v=r.x;r.x=r.y;r.y=v});
 em.forEach(e=>{const v=e[0];e[0]=e[1];e[1]=v;e[2]=[1,0,3,2][e[2]]});PT=[];RP=[]}

 daily=!!dly;lv=i;stg=stOf(i);if(i>=80)pg=((i-80)/20)|0;gw=10;gh=6;tp=false;hist=[];const d=LV[i];cells=[];rots=[];tgts=[];em=d.e.map(e=>e.slice());

  if(o){o.t=o.a=(o.s||0)*90;if(o.k=='M'||o.k=='S')rots.push({x,y});if(o.k=='T'||o.k=='K')tgts.push({x,y,k:o.k,m:o.m})}

const DX=[1,0,-1,0],DY=[0,1,0,-1],RF=[[3,2,1,0],[1,0,3,2]];
const gateOpen=()=>(Math.floor(T/1.6)&1)==0;
function trace(fg){let open=false,r;for(let p=0;p<2;p++){r=run(open,fg);if(r.key&&!open)open=true;else break}r.open=open;return r}
function run(open,fg){
 const segs=[],lit={},seen=new Set();let key=false;const q=em.map(e=>[e[0],e[1],e[2],e[3]]);
 while(q.length){
  let [x,y,d,c]=q.pop(),sx=x,sy=y,n=0;
  while(n++<80){
   const nx=x+DX[d],ny=y+DY[d];
   if(nx<0||ny<0||nx>=gw||ny>=gh){segs.push([sx,sy,x+DX[d]*.5,y+DY[d]*.5,c]);break}
   const k=cells[ny][nx];
   if(k&&(k.k=='#'||k.k=='E'||(k.k=='X'&&!fg&&!gateOpen())||(k.k=='L'&&!open&&!fg))){segs.push([sx,sy,x+DX[d]*.5,y+DY[d]*.5,c]);break}
   x=nx;y=ny;if(!k)continue;
   if(k.k=='T'||k.k=='K'){segs.push([sx,sy,x,y,c]);const id=x+','+y;lit[id]=(lit[id]||0)|c;if(k.k=='K')key=true;break}

    const id=x+','+y+','+d+','+c;if(seen.has(id))break;seen.add(id);

  }}

// ===== 5 stages x 20 levels: handcrafted openers + procedural levels, solvable by construction =====
const LV=[],SH=['EASY','MED','HARD','EXTR','X-HARD'],NM=['EASY','MEDIUM','HARD','EXTREME','EXTREMELY HARD'],SC=['#3f9','#3cf','#fd3','#f83','#f33'],
NT=[1,2,3,3,4],NX=[2,2,2,3,3],SL=[8,7,6,5,4],LTR={1:'r',2:'g',4:'b',3:'y',6:'c',5:'p',7:'w'};
function ray(t,w,turns,occ,R){ // builds a beam path backwards from target t; returns mirrors, plain cells, emitter
 let x=t[0],y=t[1],tmp={},cs=[],ms=[],em=null;
 const free=(a,b)=>a>=0&&b>=0&&a<10&&b<6&&!occ[b][a]&&!tmp[a+','+b];
 for(let k=0;k<=turns;k++){
  const L=k==turns?2+R(2):1+R(3);
  for(let i=0;i<L;i++){x+=DX[w];y+=DY[w];if(!free(x,y))return null;tmp[x+','+y]=1;if(i<L-1)cs.push([x,y,(w+2)%4])}
  if(k==turns)em=[x,y,(w+2)%4];
  else{const nw=(w+(R(2)?1:3))%4,di=(nw+2)%4,dout=(w+2)%4;ms.push({x,y,s:RF[0][di]==dout?0:1,sp:0});w=nw}}
 return{tmp,cs,ms,em}}
function tg(s,j,R,rx,sh){
 const grid=()=>[...Array(6)].map(()=>Array(10).fill(0)),occ=grid(),g=grid().map(r=>r.map(()=>'.')),em=[],sol={},rot=[];
 const mark=o=>{for(const k in o){const p=k.split(',');occ[p[1]][p[0]]=1}};
 const rays=s==0?1:s==1?(j>=8?2:1):s==2?2:s==3?(j>=10?3:2):3;
 const nt=Math.max(1,Math.round(Math.min(8,NT[s]+Math.floor(j*NX[s]/20))*(rays>1?.6:1))-sh);
 const colors=rays==1?[7]:rays==3?[1,2,4]:[[1,2],[1,4],[2,4]][R(3)],mask=colors.reduce((a,b)=>a|b,0);
 const tx=1+R(8),ty=1+R(4);occ[ty][tx]=1;g[ty][tx]=LTR[mask];
 const ds=[0,1,2,3].sort(()=>R(3)-1),rs=[];
 for(let i=0;i<rays;i++){const r=ray([tx,ty],ds[i],nt,occ,R);if(!r)return null;mark(r.tmp);rs.push({r,c:colors[i]})}
 const plain=[];rs.forEach((q,i)=>q.r.cs.forEach(c=>plain.push({c,i})));
 const take=()=>plain.length?plain.splice(R(plain.length),1)[0]:null;
 if(s>=1&&(j%2==1||s>=3)&&!(rx&&s<3)){ // splitter feeding a second target
  const p=take();if(!p)return null;const x=p.c[0],y=p.c[1],d=p.c[2],st=R(2),rd=RF[st][d],L=1+R(3);let a=x,b=y;
  for(let i=0;i<L;i++){a+=DX[rd];b+=DY[rd];if(a<0||b<0||a>9||b>5||occ[b][a])return null;occ[b][a]=1}
  g[b][a]=LTR[colors[p.i]];rot.push({x,y,s:st,sp:1})}
 const ng=s>=2&&(j%2==0||s>=3)?(s==4?2:1):0;
 for(let i=0;i<ng;i++){const p=take();if(p)g[p.c[1]][p.c[0]]='x'}
 if(s>=3&&(s==4||j%2==1)&&!rx){ // key + door
  const p=take();if(!p)return null;let kr=null;
  for(let a=0;a<14&&!kr;a++){const kx=R(10),ky=R(6);if(occ[ky][kx])continue;occ[ky][kx]=1;kr=ray([kx,ky],R(4),1+R(2),occ,R);if(kr){mark(kr.tmp);g[ky][kx]='k';rs.push({r:kr,c:7})}else occ[ky][kx]=0}
  if(!kr)return null;g[p.c[1]][p.c[0]]='L'}
 rs.forEach(q=>{q.r.ms.forEach(m=>rot.push(m));em.push([q.r.em[0],q.r.em[1],q.r.em[2],q.c])});
 let nw=3+s*2,nd=Math.min(3,s);
 for(let a=0;a<90&&(nw>0||nd>0);a++){const x=R(10),y=R(6);if(occ[y][x])continue;occ[y][x]=1;if(nw>0){g[y][x]='#';nw--}else{g[y][x]=R(2)?'m':'n';nd--}}
 let wrong=0;const pw=[50,60,65,70,75][s];
 rot.forEach(m=>{const w=R(100)<pw?1:0;m.i=m.s^w;wrong+=w;sol[m.x+','+m.y]=m.s});
 if(!wrong){rot[R(rot.length)].i^=1;wrong=1}
 rot.forEach(m=>g[m.y][m.x]=m.sp?(m.i?'Z':'S'):(m.i?'n':'m'));

function gen(s,j){

  for(let i=0;i<6;i++){const a=i*Math.PI/3+now*.5;ctx[i?'lineTo':'moveTo'](Math.cos(a)*u*.5,Math.sin(a)*u*.5)}ctx.closePath();ctx.stroke();if(ok){ctx.fillStyle='rgba(255,225,77,.4)';ctx.fill()}break}
 case'L':ctx.globalAlpha=res.open?.18:1;ctx.strokeStyle='#ffe14d';ctx.lineWidth=4;ctx.shadowColor='#ffe14d';ctx.shadowBlur=10;
  for(const o of[-.4,0,.4]){ctx.beginPath();ctx.moveTo(o*u,-u*.8);ctx.lineTo(o*u,u*.8);ctx.stroke()}break;
 case'X':{const op=gateOpen();ctx.strokeStyle='#ff4d6d';ctx.shadowColor='#ff4d6d';ctx.shadowBlur=op?2:16;ctx.lineWidth=3;ctx.globalAlpha=op?.35:1;
  if(op)ctx.setLineDash([5,6]);ctx.strokeRect(-u*.72,-u*.72,u*1.44,u*1.44);if(!op){ctx.fillStyle='rgba(255,77,109,.28)';ctx.fillRect(-u*.72,-u*.72,u*1.44,u*1.44)}break}
 case'E':{const pc=rgb(k.m,1,40);ctx.rotate(k.d*Math.PI/2);ctx.fillStyle='#0a0e22';ctx.strokeStyle=pc;ctx.lineWidth=3;ctx.shadowColor=pc;ctx.shadowBlur=16;
  rrp(-u*.55,-u*.55,u*1.1,u*1.1,8);ctx.fill();ctx.stroke();ctx.fillStyle=pc;ctx.beginPath();ctx.moveTo(u*.15,-u*.25);ctx.lineTo(u*.5,0);ctx.lineTo(u*.15,u*.25);ctx.closePath();ctx.fill();
  ctx.beginPath();ctx.arc(-u*.12,0,u*.18,0,7);ctx.fill();break}
 }
 ctx.restore()}
function dBeams(){
 ctx.save();ctx.globalCompositeOperation='lighter';ctx.lineCap='round';
 for(const s of res.segs){
  const x1=ox+(s[0]+.5)*cs,y1=oy+(s[1]+.5)*cs,x2=ox+(s[2]+.5)*cs,y2=oy+(s[3]+.5)*cs,m=s[4],fl=.9+.1*Math.sin(now*50+x1);
  [[.42,.07],[.18,.16],[.07,.95]].forEach((p,i)=>{ctx.lineWidth=cs*p[0];ctx.strokeStyle=rgb(m,p[1]*fl,i==2?175:40);ctx.shadowColor=rgb(m,1,40);ctx.shadowBlur=i==2?16:0;ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke()})}
 tgts.forEach(t=>{const m=res.lit[t.x+','+t.y]||0;if(m){const x=ox+(t.x+.5)*cs,y=oy+(t.y+.5)*cs,g=ctx.createRadialGradient(x,y,0,x,y,cs*.9);g.addColorStop(0,rgb(m,.5,40));g.addColorStop(1,rgb(m,0,40));ctx.fillStyle=g;ctx.fillRect(x-cs,y-cs,cs*2,cs*2)}});
 ctx.restore()}
function dGame(){
 const hh=56+SA.t,bt=14+SA.b;cs=Math.floor(Math.min((W-24)/gw,(H-hh-bt)/gh));ox=(W-cs*gw)/2;oy=hh+(H-hh-bt-cs*gh)/2;
 ctx.save();if(shake>.2)ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);
 ctx.fillStyle='rgba(6,9,26,.75)';ctx.strokeStyle='rgba(90,130,255,.35)';ctx.lineWidth=2;rrp(ox-8,oy-8,cs*gw+16,cs*gh+16,12);ctx.fill();ctx.stroke();
 ctx.strokeStyle='rgba(90,130,255,.1)';ctx.lineWidth=1;ctx.beginPath();for(let i=1;i<gw;i++){ctx.moveTo(ox+i*cs,oy);ctx.lineTo(ox+i*cs,oy+gh*cs)}for(let j=1;j<gh;j++){ctx.moveTo(ox,oy+j*cs);ctx.lineTo(ox+gw*cs,oy+j*cs)}ctx.stroke();
 for(let y=0;y<gh;y++)for(let x=0;x<gw;x++)if(cells[y][x])dCell(cells[y][x],x,y);
 dBeams();
 if(hintT>0&&hintI>=0){const r=rots[hintI],p=(now*1.5)%1;ctx.strokeStyle='rgba(255,225,77,'+(1-p)+')';ctx.lineWidth=4;ctx.beginPath();ctx.arc(ox+(r.x+.5)*cs,oy+(r.y+.5)*cs,cs*(.4+p*.5),0,7);ctx.stroke()}
 RP.forEach(r=>{ctx.strokeStyle=A();ctx.globalAlpha=1-r.t;ctx.lineWidth=3;ctx.beginPath();ctx.arc(r.x,r.y,cs*(.3+r.t*.7),0,7);ctx.stroke()});ctx.globalAlpha=1;
 const r=rots[cur];
 if(r&&!modal){const c=ox+(r.x+.5)*cs,d=oy+(r.y+.5)*cs,s=cs*.46+Math.sin(now*5)*2,q=cs*.18;ctx.strokeStyle=A();ctx.lineWidth=3;ctx.shadowColor=A();ctx.shadowBlur=12;
  for(const sx of[-1,1])for(const sy of[-1,1]){ctx.beginPath();ctx.moveTo(c+sx*s,d+sy*(s-q));ctx.lineTo(c+sx*s,d+sy*s);ctx.lineTo(c+sx*(s-q),d+sy*s);ctx.stroke()}}
 ctx.globalCompositeOperation='lighter';ctx.shadowBlur=0;
 PT.forEach(p=>{ctx.globalAlpha=Math.max(0,p.l);ctx.fillStyle=p.c;ctx.fillRect(p.x-2,p.y-2,4,4)});
 ctx.restore();
 // HUD
 btn(10+SA.l,8+SA.t,44,40,'◀',()=>scr='select',{s:16});
 const nar=W<720;
 if(!nar)txt('◈ '+S.coins,64+SA.l,28+SA.t,15,'#ffe14d','left');
 txt(SH[stOf(lv)]+' '+numOf(lv)+(nar?' · '+moves+'/'+lim:'  ·  MOVES '+moves+'/'+lim+'  ·  PAR '+LV[lv].p),nar?(54+W-198)/2:W/2,28+SA.t,nar?13:Math.min(16,W*.026),'#fff','center',A());
 btn(W-198-SA.r,8+SA.t,44,40,'💡'+S.hints,hint,{s:13,c:'#ffe14d'});btn(W-150-SA.r,8+SA.t,44,40,'⟲',undo,{s:20});btn(W-102-SA.r,8+SA.t,44,40,'↻',()=>load(lv,daily),{s:20});btn(W-54-SA.r,8+SA.t,44,40,S.mute?'🔇':'🔊',toggleMute,{s:16});
 if(gateOpenNeeded()&&!modal)txt(gateOpen()?'GATE OPEN':'GATE CLOSED',W/2,H-6-2,11,gateOpen()?'#3f9':'#f46','center');
 if(hold>0&&!modal){ctx.fillStyle=A();ctx.fillRect(0,H-4,W*Math.min(1,hold/.35),4)}
 if(modal)dModal()}

 else{
  txt('OUT OF MOVES',W/2,py+44,Math.min(26,pw*.06),'#ff4d6d','center','#ff4d6d');txt('The beam lost coherence.',W/2,py+100,16,'#bcd');

// ===== Loop =====
function update(dt){
 now+=dt;shake*=Math.pow(.002,dt);toastT-=dt;
 if(scr=='game'){
  fit();T+=dt;res=trace();
  for(const r of rots){const c=cells[r.y][r.x];c.a+=(c.t-c.a)*Math.min(1,dt*18)}
  if(!modal){if(solved(res)){hold+=dt;if(hold>.35)win()}else hold=0}
  hintT-=dt;if(AC)humG.gain.setTargetAtTime(modal=='win'?0:Math.min(.1,.012*res.segs.length),AC.currentTime,.15)}
 else if(AC)humG.gain.setTargetAtTime(0,AC.currentTime,.1);
 if(scr=='ad')adT-=dt;
 for(const p of PT){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=.97;p.vy*=.97;p.l-=dt/p.d}PT=PT.filter(p=>p.l>0);
 for(const r of RP)r.t+=dt*3;RP=RP.filter(r=>r.t<1)}

 B=[];ctx.setTransform(dpr,0,0,dpr,0,0);ctx.globalCompositeOperation='source-over';ctx.globalAlpha=1;bg();

 if(BH()){ctx.fillStyle='rgba(255,255,255,.06)';ctx.fillRect(0,H-28,W,28);txt('[ BANNER AD SLOT ]',W/2,H-14,11,'#678')}
 if(toastT>0){ctx.save();ctx.globalAlpha=Math.min(1,toastT);rrp(W/2-150,H*.82-18,300,36,18);ctx.fillStyle='rgba(0,0,0,.8)';ctx.fill();ctx.restore();ctx.save();ctx.globalAlpha=Math.min(1,toastT);txt(toastS,W/2,H*.82,14,'#fff');ctx.restore()}}
let last=0;

 if(m[2]!==undefined){const i=+m[2]-1;if(i>=0&&i<5000&&lvUnl(i))load(i);else toast('Level locked')}
 else if(m[1]=='daily')load(dailyIdx(),1);else scr=m[1]=='shop'?'shop':'ach'}catch(e){}}
try{const AP=Capacitor.Plugins.App;AP.addListener('appUrlOpen',e=>openLink(e.url));AP.getLaunchUrl().then(r=>r&&r.url&&openLink(r.url))}catch(e){}
function onBack(){if(scr=='game')scr='select';else if(scr=='select'||scr=='shop'||scr=='ach'||scr=='priv')scr='title';else if(scr=='title'){try{Capacitor.Plugins.App.exitApp()}catch(e){}}}
document.addEventListener('backbutton',onBack);try{Capacitor.Plugins.App.addListener('backButton',onBack)}catch(e){}
function loop(t){const dt=Math.min(.05,(t-last)/1000||0);last=t;if(dt>.03){if(++slow>90&&!LQ){LQ=1;resize();toast('Performance mode on')}}else if(slow>0)slow--;update(dt);draw();requestAnimationFrame(loop)}
